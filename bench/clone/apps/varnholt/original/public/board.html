<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manifests - Varnholt</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <header>
      <h1>Varnholt</h1>
      <nav aria-label="Sections">
        <a href="/">Manifests</a>
        <a href="/summary">Summary</a>
        <a href="/about">About</a>
      </nav>
    </header>
    <main>
      <h2 id="heading">Manifests</h2>
      <div id="notice" aria-live="polite"></div>
      <form id="filter">
        <label>Status
          <select id="filter-status" name="status">
            <option value="">All</option>
            <option value="open">Open</option>
            <option value="sealed">Sealed</option>
            <option value="dispatched">Dispatched</option>
            <option value="delivered">Delivered</option>
          </select>
        </label>
        <label>Search <input id="filter-q" name="q" type="text" /></label>
        <button type="submit">Apply filter</button>
      </form>
      <p id="count"></p>
      <table>
        <caption>Van loads</caption>
        <thead>
          <tr><th>Code</th><th>Destination</th><th>Status</th><th>Parcels</th><th>Weight</th><th>Room left</th><th>Charges</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <h3>New manifest</h3>
      <form id="create">
        <label>Code <input id="new-code" name="code" type="text" /></label>
        <label>Destination <input id="new-destination" name="destination" type="text" /></label>
        <label>Capacity (kg) <input id="new-capacity" name="capacityKg" type="text" inputmode="numeric" /></label>
        <button type="submit">Create manifest</button>
      </form>
    </main>
    <footer>Varnholt dispatch desk</footer>
    <!--boot-->
    <script src="/assets/common.js"></script>
    <script src="/assets/board.js"></script>
  </body>
</html>
