<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parcel - Varnholt</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <header>
      <h1>Varnholt</h1>
      <nav aria-label="Sections">
        <a href="/">Manifests</a>
        <a href="/summary">Summary</a>
        <a href="/about">About</a>
      </nav>
    </header>
    <main>
      <h2 id="heading">Parcel</h2>
      <div id="notice" aria-live="polite"></div>
      <section id="detail" hidden>
        <dl>
          <dt>Manifest</dt><dd><a id="f-manifest" href="/"></a></dd>
          <dt>Weight</dt><dd id="f-weight"></dd>
          <dt>Fragile</dt><dd id="f-fragile"></dd>
          <dt>Charge</dt><dd id="f-charge"></dd>
        </dl>
        <h3>Edit parcel</h3>
        <form id="edit">
          <label>New recipient <input id="e-recipient" name="recipient" type="text" /></label>
          <label>New weight (kg) <input id="e-weight" name="weightKg" type="text" inputmode="decimal" /></label>
          <label><input id="e-fragile" name="fragile" type="checkbox" /> Fragile</label>
          <button type="submit">Save parcel</button>
        </form>
        <p><button id="delete" type="button">Delete parcel</button></p>
      </section>
    </main>
    <footer>Varnholt dispatch desk</footer>
    <!--boot-->
    <script src="/assets/common.js"></script>
    <script src="/assets/parcel.js"></script>
  </body>
</html>
